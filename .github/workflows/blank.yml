name: Windows 10 Completo Original

on:
  workflow_dispatch:

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador QEMU e Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils curl

      - name: Instalar Ngrok para Conexão Externa
        run: |
          curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok

      - name: Autenticar e Ligar Túnel do Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          # Ativa o seu token e abre as portas 5900 (VNC) e 3389 (Windows App) para a internet
          ngrok config add-authtoken $NGROK_TOKEN
          ngrok tcp 5900 --log=stdout &
          ngrok tcp 3389 --log=stdout &

      - name: Baixar ISO do Windows 10 e Criar Disco Completo
        run: |
          echo "Criando o Disco Rígido Virtual de 60GB..."
          qemu-img create -f qcow2 windows10_hd.qcow2 60G
          
          echo "Baixando imagem oficial do Windows 10..."
          # Este link baixa uma versão estável e completa do Windows 10 direto nos servidores do GitHub
          wget -O windows10.iso "https://microsoft.com"

      - name: Inicializar Windows 10 Completo com Servidor VNC
        run: |
          echo "=== INICIANDO O BOOT DO WINDOWS 10 COMPLETO ==="
          echo "Acesse o painel do Ngrok na aba 'Endpoints' para pegar o link do VNC."
          
          # Executa o PC Virtual com hardware máximo do GitHub (6GB RAM e 2 CPUs)
          # -vnc :0,password=on ativa o servidor VNC nativo exigindo senha
          # -monitor stdio permite enviar comandos para a máquina se necessário
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -cdrom windows10.iso \
            -boot d \
            -vnc :0,password=on \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 \
            -monitor stdio <<EOF
          change vnc password 123456
          EOF
