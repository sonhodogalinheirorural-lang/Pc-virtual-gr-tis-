name: Windows 10 Completo Oficial

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      # Mantém o Tailscale que você configurou e deu certo de primeira
      - name: Conectar ao Tailscale Oficial
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Inicializar o Windows 10 Completo Autônomo
        run: |
          echo "=== INICIANDO INSTALAÇÃO AUTOMÁTICA DO WINDOWS 10 ==="
          
          # Inicia o container oficial do Windows 10 Pro completo
          # Ele baixa a ISO direto da Microsoft pelo próprio sistema seguro deles
          # Portas: 5900 (VNC no app), 8006 (VNC no navegador), 3389 (Windows App/RDP)
          sudo docker run -d --name windows_pc \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 5900:5900 \
            -p 8006:8006 \
            -p 3389:3389 \
            -e VERSION="10" \
            -e RAM_SIZE="6G" \
            -e CPU_CORES="2" \
            --restart on-failure \
            dockur/windows

          echo "=== MONITORANDO O BOOT DO WINDOWS ==="
          echo "Abra o seu VNC Viewer no novo IP do Tailscale na porta 5900."
          
          # Mostra na tela do GitHub o progresso real do download para você acompanhar
          sudo docker logs -f windows_pc
          
