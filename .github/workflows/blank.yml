name: Windows 10 Original Completo

on:
  workflow_dispatch:

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador do PC Virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget

      - name: Criar HD Virtual e Baixar Windows 10 Completo
        run: |
          echo "Criando o HD Virtual do PC de 50GB..."
          qemu-img create -f qcow2 windows10_hd.qcow2 50G
          
          echo "Baixando imagem oficial do Windows 10..."
          # Link direto da ISO oficial completa do Windows 10 Enterprise
          wget -O windows10.iso "https://microsoft.com"

      - name: Gerar Link do VNC e Iniciar Windows
        run: |
          echo "=== INICIANDO O PC VIRTUAL COM WINDOWS 10 ==="
          
          # Liga o Windows 10 com o máximo de potência do servidor do GitHub (6GB RAM e 2 CPUs)
          # O Servidor VNC nativo é ativado na porta local 5900 sem senha para facilitar seu primeiro acesso
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -cdrom windows10.iso \
            -boot d \
            -vnc :0 \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 &

          echo "=== GERANDO SEU LINK DO VNC COMPLETO ==="
          echo "Aguarde 10 segundos para o link público aparecer na tela abaixo..."
          sleep 10
          
          # Cria um túnel público temporário direto para a porta 5900 do seu VNC
          ssh -p 443 -R0.0.0.0:5900:localhost:5900 public@a.pinggy.io -o StrictHostKeyChecking=no
          
