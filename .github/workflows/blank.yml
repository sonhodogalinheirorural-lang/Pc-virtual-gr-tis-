name: Windows 10 Completo Oficial

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      # Mantém o Tailscale oficial que passou de primeira!
      - name: Conectar ao Tailscale Oficial
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Inicializar o Windows 10 Completo com VNC e RDP
        run: |
          echo "=== INICIANDO INSTALAÇÃO DO WINDOWS 10 COMPLETO ==="
          echo "Baixando e configurando o sistema automático..."
          
          # Inicia o Windows 10 completo puxando direto da internet de forma segura
          # Deixamos sem senha para você conectar direto pelo VNC Viewer
          sudo docker run -d --name windows_pc \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 5900:5900 \
            -p 3389:3389 \
            -e VERSION="10" \
            -e RAM_SIZE="6G" \
            -e CPU_CORES="2" \
            --restart on-failure \
            dockur/windows

          echo "=== TUDO PRONTO! ==="
          echo "Abra o seu VNC Viewer no IP do Tailscale na porta 5900."
          
          # Mantém o log ativo para o processo não fechar
          sudo docker logs -f windows_pc
          
