name: Windows 10 Virtual Completo

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Baixar e Configurar Tailscale
        run: |
          # Adiciona o repositório oficial e instala o Tailscale sem usar redirecionamento de comando
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://tailscale.com | sudo gpg --dearmor -o /usr/share/keyrings/tailscale-archive-keyring.gpg
          curl -fsSL https://tailscale.com | sudo tee /usr/share/keyrings/tailscale-archive-keyring.list
          sudo apt-get update
          sudo apt-get install -y tailscale

      - name: Autenticar no Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSSCALE_AUTH_KEY }}
        run: |
          # Conecta a máquina à sua rede privada do Tailscale
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY

      - name: Inicializar o Windows 10 com VNC (Senha) e Windows App (RDP)
        run: |
          echo "=== INICIANDO INSTALAÇÃO DO WINDOWS 10 COMPLETO ==="
          
          # Altere o valor abaixo em VNC_PASS para colocar a sua senha personalizada
          sudo docker run -d --name windows_pc \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 5900:5900 \
            -p 3389:3389 \
            -e VERSION="10" \
            -e VNC_PASS="123456" \
            -e RAM_SIZE="6G" \
            -e CPU_CORES="2" \
            --restart on-failure \
            dockur/windows

          echo "=== AGUARDANDO REQUISITOS DO SISTEMA ==="
          echo "Conecte-se usando o IP do Tailscale exibido no seu painel."
          
          # Mantém o log ativo para você acompanhar a inicialização
          sudo docker logs -f windows_pc
          
