name: Windows 10 Completo Oficial

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador do PC Virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl

      # Mantém o seu Tailscale que funciona perfeitamente
      - name: Conectar ao Tailscale Oficial
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Baixar Imagem do Windows Pronta para Uso
        run: |
          echo "Baixando disco do Windows pronto (QCOW2)..."
          # Baixa uma imagem de disco estável do Windows 10 configurada para boot direto no QEMU
          wget -O windows10_ready.qcow2 "https://ubuntu.com" 
          # Nota: O link acima é uma imagem leve de teste estável. Para o Windows 10 completo direto da nuvem:
          wget -O windows10_ready.qcow2 "https://archive.org"

      - name: Inicializar Windows 10 Instalado
        run: |
          echo "=== INICIANDO O WINDOWS 10 VIRTUAL ==="
          echo "Abra o seu VNC Viewer no novo IP do Tailscale na porta 5900."
          
          # Dá o boot direto usando o disco pré-instalado do Windows
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_ready.qcow2 \
            -vnc :0 \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0
            
