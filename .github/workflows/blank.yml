name: Windows 10 Completo Oficial PT-BR

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador do PC Virtual (QEMU)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl

      # Conecta ao seu Tailscale que funcionou perfeitamente nos testes anteriores
      - name: Conectar ao Tailscale Oficial
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Baixar ISO do Windows 10 PT-BR e Drivers do PC Virtual
        run: |
          echo "Criando o HD Virtual do PC de 40GB..."
          qemu-img create -f qcow2 windows10_hd.qcow2 40G
          
          echo "Baixando Drivers VirtIO (Evita erro de tela preta e reconhece o HD)..."
          wget -O virtio-win.iso "https://fedorapeople.org"

          echo "Baixando imagem oficial do Windows 10 Completo em Português (Brasil)..."
          # Link direto para a ISO estável do Windows 10 22H2 PT-BR hospedada no Archive.org
          wget -O windows10_ptbr.iso "https://archive.org"

      - name: Inicializar Windows 10 em Português com Servidor VNC
        run: |
          echo "=== INICIANDO O PC VIRTUAL COM WINDOWS 10 PT-BR ==="
          echo "Abra o seu VNC Viewer no novo IP do Tailscale na porta 5900."
          
          # Executa o QEMU acoplando a ISO em português e o CD de drivers para o boot funcionar de primeira
          # O Servidor VNC fica aberto em ':0' (Porta local 5900) escutando o IP do Tailscale
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -cdrom windows10_ptbr.iso \
            -drive file=virtio-win.iso,media=cdrom,index=1 \
            -boot d \
            -vnc :0 \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0
            run: |
          echo "=== INICIANDO O PC VIRTUAL COM WINDOWS 10 PT-BR ==="
          echo "Abra o seu VNC Viewer no novo IP do Tailscale na porta 5900."
          
          # Executa o QEMU acoplando a ISO em português e o CD de drivers para o boot funcionar de primeira
          # O Servidor VNC fica aberto em ':0' (Porta local 5900) escutando o IP do Tailscale
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -cdrom windows10_ptbr.iso \
            -drive file=virtio-win.iso,media=cdrom,index=1 \
            -boot d \
            -vnc :0 \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0
            
