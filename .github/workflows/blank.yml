name: Windows 10 Completo com Tailscale

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador do PC Virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl

      - name: Baixar e Configurar Tailscale (Modo Seguro)
        run: |
          # Baixa o arquivo de instalação sem usar o comando de redirecionamento que dava erro
          curl -fsSL https://tailscale.com -o install_tailscale.sh
          # Executa o script baixado de forma direta
          sudo sh install_tailscale.sh

      - name: Autenticar no Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSSCALE_AUTH_KEY }}
        run: |
          # Conecta a máquina do GitHub à sua conta Tailscale usando o nome correto do seu Secret
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY

      - name: Criar HD Virtual e Baixar Windows 10 Completo
        run: |
          echo "Criando o HD Virtual do PC de 50GB..."
          qemu-img create -f qcow2 windows10_hd.qcow2 50G
          
          echo "Baixando imagem oficial do Windows 10..."
          # Link oficial da ISO completa do Windows 10 Enterprise (Idioma em Português-BR)
          wget -O windows10.iso "https://microsoft.com"

      - name: Inicializar Windows 10 com Servidor VNC
        run: |
          echo "=== INICIANDO O PC VIRTUAL COM WINDOWS 10 ==="
          echo "Pegue o IP da máquina no seu painel do Tailscale e conecte no seu VNC Viewer."
          
          # Inicia o Windows 10 com suporte ao servidor VNC nativo na porta padrão 5900
          # O parâmetro -vnc :0 escuta em todas as redes, permitindo o acesso seguro pelo Tailscale
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -cdrom windows10.iso \
            -boot d \
            -vnc :0 \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0
            
