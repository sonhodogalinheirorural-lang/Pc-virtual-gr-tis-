name: Windows 10 Completo Oficial PT-BR

on:
  workflow_dispatch:

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador do PC Virtual (QEMU)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl

      - name: Conectar ao Tailscale Oficial
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Baixar Imagem do Sistema e Drivers
        run: |
          echo "Baixando Drivers VirtIO..."
          wget -q --show-progress -O virtio-win.iso "https://fedorapeople.org"

          echo "Baixando imagem do Windows 10..."
          # Download utilizando parâmetros de persistência para evitar arquivos incompletos
          curl -L -C - -o windows10_hd.qcow2 "https://hashicorp.com" || \
          wget -c -O windows10_hd.qcow2 "https://archive.org"

      - name: Inicializar Windows 10 em Português com Servidor VNC
        run: |
          echo "=== INICIANDO O PC VIRTUAL COM WINDOWS 10 PT-BR ==="
          echo "Abra o seu VNC Viewer no novo IP do Tailscale na porta 5900."
          
          # Inicialização com vga cirrus para maior compatibilidade de vídeo inicial e escuta em todas as interfaces (0.0.0.0)
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -drive file=virtio-win.iso,media=cdrom,index=1 \
            -vnc 0.0.0.0:0 \
            -vga cirrus \
            -device e1000,netdev=net0 \
            -netdev user,id=net0
            
