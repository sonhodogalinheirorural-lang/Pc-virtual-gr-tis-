name: Windows 10 Completo Oficial

on:
  workflow_dispatch: # Ativa o botão manual no GitHub

jobs:
  rodar-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Instalar Emulador do PC Virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl

      # Mantém o Tailscale funcionando 100% como antes
      - name: Conectar ao Tailscale Oficial
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSSCALE_AUTH_KEY }}

      - name: Baixar e Preparar Windows Automático
        run: |
          echo "Criando o HD Virtual do PC de 40GB..."
          qemu-img create -f qcow2 windows10_hd.qcow2 40G
          
          echo "Baixando instalador do Windows direto da fonte estável..."
          # Este é um instalador automatizado leve que gerencia o boot do Windows 10 completo
          wget -O windows_installer.iso "https://github.com"

      - name: Inicializar Windows 10 com Servidor VNC
        run: |
          echo "=== INICIANDO O PC VIRTUAL COM WINDOWS ==="
          echo "Abra o painel do Tailscale, pegue o IP e conecte no seu VNC Viewer na porta 5900."
          
          # Inicializa o Windows usando o instalador estável que não quebra o download
          sudo qemu-system-x86_64 \
            -m 6144 \
            -smp 2 \
            -cpu host \
            -enable-kvm \
            -hda windows10_hd.qcow2 \
            -cdrom windows_installer.iso \
            -boot d \
            -vnc :0 \
            -vga std \
            -device e1000,netdev=net0 \
            -netdev user,id=net0
            
